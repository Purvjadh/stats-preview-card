<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Stats preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

 
</head>
<body>

<main>
    <article class="card">

        <header class="img-div">
            <img src="/images/image-header-mobile.jpg" alt="header-image">

        </header>
        <section class="card__info">
           <h1 class="card__title"> Get <span>insights</span> that help your business grow.</h1>

            <p class="card__descrption">Discover the benefits of data analytics and make better decisions regarding revenue, customer 
              experience, and overall efficiency.</p>

            <div class="card__stats">
                <div class="company__div">
                    <p class="stats">10k+</p> 
                    <p>companies</p>
                </div>
                <div class="templates__div">
                    <p class="stats">314</p>
                    <p>templates</p>
                </div>
                <div class="queries__div">
                    <p class="stats">12M+</p>
                    <p>queries</p>
                </div>
            </div>
        </section>
    </article>
</main>

  
</body>
</html>
